<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ふたりの予定帳</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+JP:wght@400;500;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
:root{
  --bg:#EEF1F4; --surface:#FFFFFF; --ink:#18202B; --muted:#5D6978; --line:#D5DBE2;
  --accent:#1F4E8C; --accent-soft:#E3ECF8; --on-accent:#FFFFFF;
  --sun:#B3261E; --sat:#1F5FB8;
  --k-meet:#1F5FB8; --k-due:#B3261E; --k-out:#2E7D4F; --k-other:#6B7380;
  --danger:#B3261E; --ok:#2E7D4F;
  --font-body:"IBM Plex Sans JP","Hiragino Sans","Yu Gothic UI","Meiryo",system-ui,sans-serif;
  --font-num:"IBM Plex Mono",ui-monospace,Consolas,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#12161C; --surface:#1B2129; --ink:#E6EAF0; --muted:#98A3B1; --line:#2E3742;
  --accent:#8FB4EA; --accent-soft:#233349; --on-accent:#10161E;
  --sun:#F08A82; --sat:#8FB4EA;
  --k-meet:#7FAAF0; --k-due:#F08A82; --k-out:#79C79A; --k-other:#9AA3AE;
  --danger:#F08A82; --ok:#79C79A; color-scheme:dark}}

*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.6;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
[hidden]{display:none!important}
.wrap{max-width:1120px;margin:0 auto;padding-inline:16px;padding-block:16px 40px;display:flex;flex-direction:column;gap:16px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

header{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px}
.brand h1{margin:0;font-size:20px;font-weight:700;letter-spacing:.02em}
.brand .sub{font-size:12px;color:var(--muted)}
.userbox{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:13px}
.status{display:inline-flex;align-items:center;gap:6px;color:var(--muted);font-size:12px}
.status i{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.status.live i{background:var(--ok)}

.grid{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:820px){.grid{grid-template-columns:minmax(0,1fr)}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;min-width:0}

.monthbar{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px}
.monthbar h2{margin:0;font-size:18px;font-weight:700}
.monthbar h2 .y{font-family:var(--font-num);font-weight:500;color:var(--muted);font-size:14px;margin-right:6px}
.navbtns{display:flex;gap:6px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 12px;font-size:14px}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:700}
.btn.danger{color:var(--danger);border-color:var(--danger)}
.btn.small{padding:3px 10px;font-size:12px}
.btn[disabled]{opacity:.5;cursor:not-allowed}

.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border-top:1px solid var(--line);border-left:1px solid var(--line)}
.dow{font-size:11px;letter-spacing:.08em;text-align:center;padding:4px 0;color:var(--muted);border-right:1px solid var(--line);border-bottom:1px solid var(--line)}
.dow.sun{color:var(--sun)} .dow.sat{color:var(--sat)}
.cell{min-height:84px;border:0;border-right:1px solid var(--line);border-bottom:1px solid var(--line);background:transparent;padding:4px;text-align:left;display:flex;flex-direction:column;gap:2px;min-width:0}
.cell:hover{background:var(--accent-soft)}
.cell.out{opacity:.5}
.cell.sel{background:var(--accent-soft);box-shadow:inset 0 0 0 2px var(--accent)}
.num{font-family:var(--font-num);font-size:13px;width:24px;height:24px;display:inline-grid;place-items:center;border-radius:50%}
.cell.sun .num{color:var(--sun)} .cell.sat .num{color:var(--sat)}
.cell.today .num{background:var(--accent);color:var(--on-accent)}
.chip{font-size:11px;line-height:1.35;padding:1px 4px;border-radius:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border-left:3px solid var(--kc);background:var(--accent-soft)}
.more{font-size:11px;color:var(--muted)}
.dots{display:none;gap:3px;flex-wrap:wrap;padding-left:2px}
.dots i{width:6px;height:6px;border-radius:50%;background:var(--kc)}
@media (max-width:560px){.cell{min-height:52px;align-items:center}.chip,.more{display:none}.dots{display:flex}}

.dayhead{display:flex;align-items:baseline;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.dayhead h2{margin:0;font-size:17px}
.agenda{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.ev{display:grid;grid-template-columns:64px minmax(0,1fr);gap:10px;padding:10px;border:1px solid var(--line);border-left:4px solid var(--kc);border-radius:8px;background:var(--surface);text-align:left;width:100%}
.ev:hover{border-color:var(--accent);border-left-color:var(--kc)}
.ev .t{font-family:var(--font-num);font-size:13px;line-height:1.4;color:var(--muted);white-space:pre-line}
.ev .title{font-weight:700;overflow-wrap:anywhere}
.ev .meta{font-size:12px;color:var(--muted);display:flex;gap:8px;flex-wrap:wrap}
.ev .memo{font-size:13px;white-space:pre-wrap;overflow-wrap:anywhere;margin-top:2px}
.kind{font-size:11px;font-weight:700;color:var(--kc)}
.empty{color:var(--muted);font-size:14px;padding:18px 4px;text-align:center;border:1px dashed var(--line);border-radius:8px;list-style:none}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:10px}
.legend span{display:inline-flex;align-items:center;gap:4px}
.legend i{width:8px;height:8px;border-radius:2px;background:var(--kc)}
.banner{font-size:13px;padding:10px 12px;border-radius:8px;background:var(--accent-soft);border:1px solid var(--danger)}

/* ログイン画面 */
.login{max-width:380px;margin:8vh auto 0;display:flex;flex-direction:column;gap:14px}
.login h1{margin:0;font-size:22px}
.login p{margin:0;color:var(--muted);font-size:13px}

/* 入力シート */
.overlay{position:fixed;inset:0;background:rgba(10,14,20,.45);display:flex;align-items:flex-end;justify-content:center;padding:16px;padding-bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:10}
@media (min-width:600px){.overlay{align-items:center}}
.sheet{background:var(--surface);border-radius:12px;width:100%;max-width:480px;max-height:calc(100% - 16px);overflow:auto;padding:18px;display:flex;flex-direction:column;gap:12px}
.sheet h3{margin:0;font-size:17px}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field label{font-size:12px;color:var(--muted)}
.row{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
input[type=text],input[type=email],input[type=password],input[type=date],input[type=time],textarea{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%;min-width:0}
textarea{min-height:72px;resize:vertical}
.check{display:flex;align-items:center;gap:8px;font-size:14px}
.kinds{display:flex;gap:6px;flex-wrap:wrap}
.kinds button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 12px;font-size:13px;display:inline-flex;align-items:center;gap:6px}
.kinds button i{width:8px;height:8px;border-radius:50%;background:var(--kc)}
.kinds button[aria-pressed="true"]{border-color:var(--kc);box-shadow:inset 0 0 0 1px var(--kc);font-weight:700}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.actions .right{display:flex;gap:8px;margin-left:auto}
.err{color:var(--danger);font-size:13px}
.confirm{border:1px solid var(--danger);border-radius:8px;padding:10px;display:flex;flex-direction:column;gap:8px;font-size:14px}
.confirm div{display:flex;gap:8px;justify-content:flex-end}
</style>
</head>
<body>

<!-- ===== 設定ミス表示 ===== -->
<div class="wrap" id="configView" hidden>
  <div class="banner">
    接続設定がまだです。<code>index.html</code> の先頭付近にある <code>SUPABASE_URL</code> と
    <code>SUPABASE_KEY</code> を、自分の Supabase プロジェクトの値に書き換えてください。
  </div>
</div>

<!-- ===== ログイン画面 ===== -->
<div class="wrap" id="loginView" hidden>
  <form class="login panel" id="loginForm" novalidate>
    <h1>ふたりの予定帳</h1>
    <p>登録済みのメールアドレスとパスワードでログインしてください。</p>
    <div class="field"><label for="l-email">メールアドレス</label><input type="email" id="l-email" autocomplete="username" required></div>
    <div class="field"><label for="l-pass">パスワード</label><input type="password" id="l-pass" autocomplete="current-password" required></div>
    <div class="err" id="loginErr" hidden></div>
    <button type="submit" class="btn primary" id="loginBtn">ログイン</button>
  </form>
</div>

<!-- ===== メイン画面 ===== -->
<div class="wrap" id="appView" hidden>
  <header>
    <div class="brand">
      <h1>ふたりの予定帳</h1>
      <div class="sub">2人で共有する仕事のスケジュール</div>
    </div>
    <div class="userbox">
      <span class="status" id="status"><i></i><span id="statusText">接続中…</span></span>
      <span id="meName"></span>
      <button class="btn small" id="nameBtn">表示名を変更</button>
      <button class="btn small" id="logoutBtn">ログアウト</button>
    </div>
  </header>

  <div class="banner" id="banner" hidden></div>

  <div class="grid">
    <section class="panel" aria-label="月カレンダー">
      <div class="monthbar">
        <h2 id="monthTitle"></h2>
        <div class="navbtns">
          <button class="btn" id="prevBtn" aria-label="前の月">‹</button>
          <button class="btn" id="todayBtn">今日</button>
          <button class="btn" id="nextBtn" aria-label="次の月">›</button>
        </div>
      </div>
      <div class="cal" id="cal"></div>
      <div class="legend" id="legend"></div>
    </section>

    <section class="panel" aria-label="選んだ日の予定">
      <div class="dayhead">
        <h2 id="dayTitle"></h2>
        <button class="btn primary" id="addBtn">＋ 予定を追加</button>
      </div>
      <ul class="agenda" id="agenda"></ul>
    </section>
  </div>
</div>

<!-- ===== 予定の入力 ===== -->
<div class="overlay" id="evOverlay" hidden>
  <form class="sheet" id="evForm" novalidate>
    <h3 id="evFormTitle">予定を追加</h3>
    <div class="field"><label for="f-title">件名</label><input type="text" id="f-title" maxlength="80" placeholder="例：A社と打ち合わせ"></div>
    <div class="field"><label for="f-date">日付</label><input type="date" id="f-date"></div>
    <label class="check"><input type="checkbox" id="f-allday"> 終日</label>
    <div class="row" id="timeRow">
      <div class="field"><label for="f-start">開始</label><input type="time" id="f-start"></div>
      <div class="field"><label for="f-end">終了（任意）</label><input type="time" id="f-end"></div>
    </div>
    <div class="field"><label id="kindLabel">種類</label><div class="kinds" id="kinds" role="group" aria-labelledby="kindLabel"></div></div>
    <div class="field"><label for="f-memo">メモ（場所・持ち物など）</label><textarea id="f-memo" maxlength="1000"></textarea></div>
    <div class="err" id="evErr" hidden></div>
    <div class="confirm" id="confirmBox" hidden>
      <span>この予定を削除します。元に戻せません。</span>
      <div><button type="button" class="btn" id="cancelDel">やめる</button><button type="button" class="btn danger" id="doDel">削除する</button></div>
    </div>
    <div class="actions">
      <button type="button" class="btn danger" id="delBtn" hidden>削除</button>
      <div class="right">
        <button type="button" class="btn" id="evClose">キャンセル</button>
        <button type="submit" class="btn primary" id="evSave">保存</button>
      </div>
    </div>
  </form>
</div>

<!-- ===== 表示名の入力 ===== -->
<div class="overlay" id="nameOverlay" hidden>
  <form class="sheet" id="nameForm" novalidate>
    <h3>表示名</h3>
    <p style="margin:0;font-size:13px;color:var(--muted)">予定に「誰が登録・更新したか」として表示される名前です。</p>
    <div class="field"><label for="n-name">表示名（20文字まで）</label><input type="text" id="n-name" maxlength="20" placeholder="例：市毛"></div>
    <div class="err" id="nameErr" hidden></div>
    <div class="actions"><div class="right">
      <button type="button" class="btn" id="nameClose">キャンセル</button>
      <button type="submit" class="btn primary" id="nameSave">保存</button>
    </div></div>
  </form>
</div>

<!-- Supabase の公式ライブラリ（バージョン固定） -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.js"></script>
<script>
/* ============================================================
   ▼ ここを自分の Supabase プロジェクトの値に書き換える ▼
   （Supabase の Project Settings → API Keys / Data API で確認）
   ============================================================ */
const SUPABASE_URL = "https://supabase.com/dashboard/project/fnmmxoeacjuabeagznbb/settings/api-keys";
const SUPABASE_KEY = "sb_publishable_NH8K8K95XaSkmlxjbApp3w_J163dgbj";   // sb_publishable_... または anon キー（公開してよいキー）
/* ============================================================ */

(function () {
  "use strict";

  const KINDS = [
    { id: "meet",  label: "打合せ", color: "var(--k-meet)" },
    { id: "due",   label: "締切",   color: "var(--k-due)" },
    { id: "out",   label: "外出",   color: "var(--k-out)" },
    { id: "other", label: "その他", color: "var(--k-other)" },
  ];
  const KIND_BY = Object.fromEntries(KINDS.map(k => [k.id, k]));
  const DOW = ["日", "月", "火", "水", "木", "金", "土"];
  const $ = id => document.getElementById(id);
  const pad = n => String(n).padStart(2, "0");
  const ymd = (y, m, d) => `${y}-${pad(m + 1)}-${pad(d)}`;          // m は 0〜11（端末の現地日付）
  const todayStr = () => { const t = new Date(); return ymd(t.getFullYear(), t.getMonth(), t.getDate()); };
  const parseYmd = s => { const [y, m, d] = s.split("-").map(Number); return { y, m: m - 1, d }; };
  const hhmm = t => (t ? String(t).slice(0, 5) : "");               // "09:00:00" → "09:00"

  const state = {
    sb: null, session: null, me: null,
    events: [], profiles: {}, loaded: false,
    viewY: new Date().getFullYear(), viewM: new Date().getMonth(), sel: todayStr(),
    editingId: null, formKind: "meet", channel: null, fetchSeq: 0,
  };

  /* ---------- 画面の切り替え ---------- */
  function show(view) {
    ["configView", "loginView", "appView"].forEach(v => { $(v).hidden = v !== view; });
  }
  function banner(msg) { $("banner").textContent = msg || ""; $("banner").hidden = !msg; }
  function setStatus(text, live) { $("statusText").textContent = text; $("status").className = "status" + (live ? " live" : ""); }
  function showErr(id, msg) { $(id).textContent = msg || ""; $(id).hidden = !msg; }

  /* ---------- 起動 ---------- */
  if (!window.supabase || SUPABASE_URL.includes("YOUR-PROJECT-ID") || SUPABASE_KEY.startsWith("YOUR-")) {
    show("configView");
    if (!window.supabase) $("configView").firstElementChild.textContent = "Supabase のライブラリを読み込めませんでした。インターネット接続を確認して、ページを再読み込みしてください。";
    return;
  }
  state.sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  // ログイン状態の変化を監視（コールバック内では他の Supabase 呼び出しを直接 await しない）
  state.sb.auth.onAuthStateChange((event, session) => {
    setTimeout(() => onSession(session), 0);
  });

  async function onSession(session) {
    const prevUser = state.session && state.session.user.id;
    state.session = session;
    if (!session) { stopRealtime(); state.events = []; state.loaded = false; show("loginView"); return; }
    if (prevUser === session.user.id && state.loaded) return;  // トークン更新だけなら何もしない
    state.me = session.user.id;
    show("appView");
    renderLegend(); render();
    await loadProfiles();
    if (!state.profiles[state.me]) openNameForm(true);
    await loadEvents();
    startRealtime();
  }

  /* ---------- ログイン／ログアウト ---------- */
  $("loginForm").addEventListener("submit", async e => {
    e.preventDefault();
    const email = $("l-email").value.trim(), password = $("l-pass").value;
    if (!email || !password) return showErr("loginErr", "メールアドレスとパスワードを入力してください。");
    showErr("loginErr", ""); $("loginBtn").disabled = true;
    const { error } = await state.sb.auth.signInWithPassword({ email, password });
    $("loginBtn").disabled = false;
    if (error) {
      const bad = error.code === "invalid_credentials" || /invalid login credentials/i.test(error.message || "");
      showErr("loginErr", bad ? "メールアドレスかパスワードが違います。" : "ログインできませんでした（" + (error.message || "通信エラー") + "）。");
    } else { $("l-pass").value = ""; }
  });
  $("logoutBtn").addEventListener("click", async () => { await state.sb.auth.signOut(); });

  /* ---------- データの読み込み ---------- */
  function visibleRange() {
    const first = new Date(state.viewY, state.viewM, 1);
    const start = new Date(state.viewY, state.viewM, 1 - first.getDay());
    const end = new Date(start.getFullYear(), start.getMonth(), start.getDate() + 41);
    return [ymd(start.getFullYear(), start.getMonth(), start.getDate()), ymd(end.getFullYear(), end.getMonth(), end.getDate())];
  }

  async function loadEvents() {
    const seq = ++state.fetchSeq;
    const [from, to] = visibleRange();
    const { data, error } = await state.sb.from("events").select("*")
      .gte("event_date", from).lte("event_date", to).order("event_date");
    if (seq !== state.fetchSeq) return;               // 古い読み込み結果は捨てる
    if (error) {
      setStatus("接続できません", false);
      banner("予定を読み込めませんでした。Supabase のプロジェクトが一時停止していないか確認してください。（" + error.message + "）");
      return;
    }
    banner("");
    state.events = data; state.loaded = true;
    if (data.some(ev => ev.updated_by && !state.profiles[ev.updated_by])) await loadProfiles();
    render();
  }

  async function loadProfiles() {
    const { data, error } = await state.sb.from("profiles").select("id, display_name");
    if (error) return;
    state.profiles = Object.fromEntries(data.map(p => [p.id, p.display_name]));
    $("meName").textContent = state.profiles[state.me] ? state.profiles[state.me] + " さん" : "";
  }

  /* ---------- リアルタイム更新 ---------- */
  let refetchTimer = null;
  function startRealtime() {
    stopRealtime();
    state.channel = state.sb.channel("events-changes")
      .on("postgres_changes", { event: "*", schema: "public", table: "events" }, () => {
        clearTimeout(refetchTimer); refetchTimer = setTimeout(loadEvents, 300);
      })
      .subscribe(status => {
        if (status === "SUBSCRIBED") { setStatus("同期中（自動更新）", true); loadEvents(); }
        else if (status === "CHANNEL_ERROR" || status === "TIMED_OUT" || status === "CLOSED") setStatus("自動更新が止まっています（再読み込みしてください）", false);
      });
  }
  function stopRealtime() { if (state.channel) { state.sb.removeChannel(state.channel); state.channel = null; } }

  /* ---------- 描画 ---------- */
  const kindOf = ev => KIND_BY[ev.kind] || KIND_BY.other;
  function eventsOn(ds) {
    return state.events.filter(ev => ev.event_date === ds).sort((a, b) => {
      if (a.all_day !== b.all_day) return a.all_day ? -1 : 1;
      const sa = a.start_time || "", sb = b.start_time || "";
      if (sa !== sb) return sa < sb ? -1 : 1;
      return a.title < b.title ? -1 : 1;
    });
  }

  function renderLegend() {
    const el = $("legend"); el.textContent = "";
    KINDS.forEach(k => {
      const s = document.createElement("span"); s.style.setProperty("--kc", k.color);
      s.append(document.createElement("i"), k.label); el.append(s);
    });
  }

  function renderCalendar() {
    const y = state.viewY, m = state.viewM;
    const t = $("monthTitle"); t.textContent = "";
    const ys = document.createElement("span"); ys.className = "y"; ys.textContent = y;
    t.append(ys, (m + 1) + "月");

    const cal = $("cal"); cal.textContent = "";
    DOW.forEach((d, i) => {
      const h = document.createElement("div"); h.className = "dow" + (i === 0 ? " sun" : i === 6 ? " sat" : ""); h.textContent = d; cal.append(h);
    });
    const first = new Date(y, m, 1);
    const today = todayStr();
    for (let i = 0; i < 42; i++) {
      const dt = new Date(y, m, 1 - first.getDay() + i);
      if (i >= 35 && dt.getMonth() !== m) break;      // 6行目が丸ごと翌月なら表示しない
      const ds = ymd(dt.getFullYear(), dt.getMonth(), dt.getDate());
      const evs = eventsOn(ds);
      const b = document.createElement("button"); b.type = "button"; b.dataset.date = ds;
      b.className = "cell" + (dt.getMonth() !== m ? " out" : "") + (dt.getDay() === 0 ? " sun" : "") + (dt.getDay() === 6 ? " sat" : "")
        + (ds === today ? " today" : "") + (ds === state.sel ? " sel" : "");
      b.setAttribute("aria-label", `${dt.getMonth() + 1}月${dt.getDate()}日 予定${evs.length}件`);
      const n = document.createElement("span"); n.className = "num"; n.textContent = dt.getDate(); b.append(n);
      evs.slice(0, 2).forEach(ev => {
        const c = document.createElement("span"); c.className = "chip"; c.style.setProperty("--kc", kindOf(ev).color);
        c.textContent = (ev.all_day ? "" : hhmm(ev.start_time) + " ") + ev.title; b.append(c);
      });
      if (evs.length > 2) { const mo = document.createElement("span"); mo.className = "more"; mo.textContent = `+${evs.length - 2}件`; b.append(mo); }
      if (evs.length) {
        const dots = document.createElement("span"); dots.className = "dots";
        evs.slice(0, 4).forEach(ev => { const d = document.createElement("i"); d.style.setProperty("--kc", kindOf(ev).color); dots.append(d); });
        b.append(dots);
      }
      cal.append(b);
    }
  }

  function renderAgenda() {
    const p = parseYmd(state.sel), dt = new Date(p.y, p.m, p.d);
    $("dayTitle").textContent = `${p.m + 1}月${p.d}日（${DOW[dt.getDay()]}）` + (state.sel === todayStr() ? "・今日" : "");
    const list = $("agenda"); list.textContent = "";
    if (!state.loaded) { const li = document.createElement("li"); li.className = "empty"; li.textContent = "予定を読み込んでいます…"; list.append(li); return; }
    const evs = eventsOn(state.sel);
    if (!evs.length) { const li = document.createElement("li"); li.className = "empty"; li.textContent = "この日の予定はまだありません。「＋ 予定を追加」から登録できます。"; list.append(li); return; }
    evs.forEach(ev => {
      const k = kindOf(ev);
      const li = document.createElement("li");
      const b = document.createElement("button"); b.type = "button"; b.className = "ev"; b.dataset.id = ev.id; b.style.setProperty("--kc", k.color);
      const t = document.createElement("div"); t.className = "t";
      t.textContent = ev.all_day ? "終日" : hhmm(ev.start_time) + (ev.end_time ? "\n–" + hhmm(ev.end_time) : "");
      const body = document.createElement("div"); body.style.minWidth = "0";
      const ti = document.createElement("div"); ti.className = "title"; ti.textContent = ev.title;
      const meta = document.createElement("div"); meta.className = "meta";
      const kd = document.createElement("span"); kd.className = "kind"; kd.textContent = k.label; meta.append(kd);
      if (ev.updated_by) {
        const w = document.createElement("span");
        w.textContent = "更新: " + (ev.updated_by === state.me ? "自分" : (state.profiles[ev.updated_by] || "メンバー"));
        meta.append(w);
      }
      body.append(ti, meta);
      if (ev.memo) { const mm = document.createElement("div"); mm.className = "memo"; mm.textContent = ev.memo; body.append(mm); }
      b.append(t, body); li.append(b); list.append(li);
    });
  }

  function render() { renderCalendar(); renderAgenda(); }

  /* ---------- カレンダー操作 ---------- */
  function moveMonth(delta) {
    const d = new Date(state.viewY, state.viewM + delta, 1);
    state.viewY = d.getFullYear(); state.viewM = d.getMonth();
    renderCalendar(); loadEvents();
  }
  $("prevBtn").addEventListener("click", () => moveMonth(-1));
  $("nextBtn").addEventListener("click", () => moveMonth(1));
  $("todayBtn").addEventListener("click", () => {
    const t = new Date(); const changed = t.getFullYear() !== state.viewY || t.getMonth() !== state.viewM;
    state.viewY = t.getFullYear(); state.viewM = t.getMonth(); state.sel = todayStr(); render(); if (changed) loadEvents();
  });
  $("cal").addEventListener("click", e => {
    const c = e.target.closest(".cell"); if (!c) return;
    state.sel = c.dataset.date;
    const p = parseYmd(state.sel);
    if (p.y !== state.viewY || p.m !== state.viewM) { state.viewY = p.y; state.viewM = p.m; render(); loadEvents(); }
    else render();
  });
  $("agenda").addEventListener("click", e => { const b = e.target.closest(".ev"); if (b) openEventForm(b.dataset.id); });
  $("addBtn").addEventListener("click", () => openEventForm(null));

  /* ---------- 予定の入力フォーム ---------- */
  function renderKinds() {
    const box = $("kinds"); box.textContent = "";
    KINDS.forEach(k => {
      const b = document.createElement("button"); b.type = "button"; b.style.setProperty("--kc", k.color);
      b.setAttribute("aria-pressed", String(state.formKind === k.id));
      b.append(document.createElement("i"), k.label);
      b.addEventListener("click", () => { state.formKind = k.id; renderKinds(); });
      box.append(b);
    });
  }
  const syncAllDay = () => { $("timeRow").hidden = $("f-allday").checked; };
  $("f-allday").addEventListener("change", syncAllDay);

  function setEvBusy(b) { ["evSave", "delBtn", "doDel", "evClose"].forEach(id => { $(id).disabled = b; }); }

  function openEventForm(id) {
    const ev = id ? state.events.find(x => x.id === id) : null;
    state.editingId = ev ? ev.id : null;
    $("evFormTitle").textContent = ev ? "予定を編集" : "予定を追加";
    $("f-title").value = ev ? ev.title : "";
    $("f-date").value = ev ? ev.event_date : state.sel;
    $("f-allday").checked = ev ? ev.all_day : false;
    $("f-start").value = ev && !ev.all_day ? hhmm(ev.start_time) : "09:00";
    $("f-end").value = ev && !ev.all_day ? hhmm(ev.end_time) : "10:00";
    $("f-memo").value = ev ? ev.memo : "";
    state.formKind = ev && KIND_BY[ev.kind] ? ev.kind : "meet";
    renderKinds(); syncAllDay();
    $("delBtn").hidden = !ev; $("confirmBox").hidden = true;
    showErr("evErr", ""); setEvBusy(false);
    $("evOverlay").hidden = false;
    setTimeout(() => $("f-title").focus(), 0);
  }
  function closeEventForm() { $("evOverlay").hidden = true; state.editingId = null; }
  $("evClose").addEventListener("click", closeEventForm);
  $("evOverlay").addEventListener("click", e => { if (e.target === $("evOverlay")) closeEventForm(); });

  function dbErrorText(error) {
    if (!error) return "";
    if (error.code === "23514") return "入力内容を確認してください（件名は80文字まで、終了時刻は開始時刻より後）。";
    if (error.code === "42501") return "この操作をする権限がありません。ログインし直してください。";
    return "保存できませんでした。通信状態を確認して、もう一度お試しください。（" + error.message + "）";
  }

  $("evForm").addEventListener("submit", async e => {
    e.preventDefault();
    const title = $("f-title").value.trim(), date = $("f-date").value, allDay = $("f-allday").checked;
    const start = $("f-start").value, end = $("f-end").value;
    if (!title) return showErr("evErr", "件名を入力してください。");
    if (!/^\d{4}-\d{2}-\d{2}$/.test(date)) return showErr("evErr", "日付を選んでください。");
    if (!allDay && !start) return showErr("evErr", "開始時刻を入力するか、「終日」にチェックを入れてください。");
    if (!allDay && end && end <= start) return showErr("evErr", "終了時刻は開始時刻より後にしてください。");
    const row = {
      title, event_date: date, all_day: allDay,
      start_time: allDay ? null : start, end_time: allDay || !end ? null : end,
      kind: state.formKind, memo: $("f-memo").value.trim(),
    };
    showErr("evErr", ""); setEvBusy(true);
    const q = state.editingId
      ? state.sb.from("events").update(row).eq("id", state.editingId)
      : state.sb.from("events").insert(row);
    const { error } = await q;
    if (error) { setEvBusy(false); return showErr("evErr", dbErrorText(error)); }
    const p = parseYmd(date);
    state.sel = date; state.viewY = p.y; state.viewM = p.m;
    closeEventForm(); render(); loadEvents();
  });

  $("delBtn").addEventListener("click", () => { $("confirmBox").hidden = false; });
  $("cancelDel").addEventListener("click", () => { $("confirmBox").hidden = true; });
  $("doDel").addEventListener("click", async () => {
    if (!state.editingId) return;
    setEvBusy(true);
    const { error } = await state.sb.from("events").delete().eq("id", state.editingId);
    if (error) { setEvBusy(false); return showErr("evErr", dbErrorText(error)); }
    closeEventForm(); loadEvents();
  });

  /* ---------- 表示名 ---------- */
  function openNameForm(first) {
    $("n-name").value = state.profiles[state.me] || "";
    $("nameClose").hidden = !!first;                  // 初回は必ず設定してもらう
    showErr("nameErr", ""); $("nameOverlay").hidden = false;
    setTimeout(() => $("n-name").focus(), 0);
  }
  $("nameBtn").addEventListener("click", () => openNameForm(false));
  $("nameClose").addEventListener("click", () => { $("nameOverlay").hidden = true; });
  $("nameForm").addEventListener("submit", async e => {
    e.preventDefault();
    const name = $("n-name").value.trim();
    if (!name) return showErr("nameErr", "表示名を入力してください。");
    $("nameSave").disabled = true;
    const { error } = await state.sb.from("profiles").upsert({ id: state.me, display_name: name });
    $("nameSave").disabled = false;
    if (error) return showErr("nameErr", dbErrorText(error));
    $("nameOverlay").hidden = true;
    await loadProfiles(); render();
  });

  document.addEventListener("keydown", e => {
    if (e.key !== "Escape") return;
    if (!$("evOverlay").hidden) closeEventForm();
    else if (!$("nameOverlay").hidden && !$("nameClose").hidden) $("nameOverlay").hidden = true;
  });
})();
</script>
</body>
</html>
